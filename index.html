<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الأول</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      padding: 40px 20px;
    }

    h1 {
      font-size: 38px;
    }

    p {
      font-size: 20px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 35px;
      background: white;
      color: #2563eb;
      text-decoration: none;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>أهلا بيك في موقعي 👋</h1>

    <p>اكتشف عالم الهواتف 📱</p>

    <a class="button" href="phones.html">

</html>
